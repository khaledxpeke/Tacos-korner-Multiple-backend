openapi: 3.0.3
info:
  title: LayaFood Backend API
  description: |
    REST API for the LayaFood multi-restaurant ordering platform (dashboard, kiosk, mobile, kitchen).

    ## Authentication
    Most endpoints require:
    - `Authorization: Bearer <JWT>` header
    - `restaurant-id: <ObjectId>` header (restaurant-scoped routes)
    - `app-type` header: `mobile` | `borne` | `dashboard` | `cashier` | `delivery` | `kitchen`

    ## i18n
    Pass `?lng=en|fr|ar` query param or use language cookie.

    ---

    ## Socket.IO (Real-time)

    **Connect to:** `{baseUrl}` with path `/socket.io/`  
    **Transports:** websocket, polling  
    **CORS:** `*`

    ### Client → Server events

    | Event | Payload | Description |
    |-------|---------|-------------|
    | `join-restaurant` | `{ restaurantId: string }` | Join room `restaurant-{restaurantId}`. Registers `fetch-histories` listener. |
    | `fetch-histories` | See schema below | Fetch paginated order history (emitted after join-restaurant) |
    | `disconnect` | — | Client disconnects |

    **`fetch-histories` payload:**
    ```json
    {
      "restaurantId": "ObjectId",
      "page": 1,
      "search": "",
      "startDate": "YYYY-MM-DD",
      "endDate": "YYYY-MM-DD",
      "filter": "today|week|month",
      "status": "all|enCours|terminee|annulee|echouee|enAttente|enRetard|remboursee"
    }
    ```

    ### Server → Client events

    | Event | Room | Description |
    |-------|------|-------------|
    | `histories-update` | `restaurant-{id}` | Response to `fetch-histories` (histories, pagination, stats) |
    | `new-history` | `restaurant-{id}` | New order created |
    | `status-update` | broadcast | Order status changed `{ id, status, updatedAt }` |
    | `settings-updated` | `restaurant-{id}` | Restaurant settings changed |
    | `print_success` | broadcast | Order printed successfully |
    | `print_skipped` | broadcast | Auto-print skipped (local mode) |
    | `print_failed` | broadcast | Print job failed |
    | `print_retry_exhausted` | broadcast | All print retries exhausted |
    | `error` | varies | Error message |

  version: 1.0.0
  contact:
    name: LayaFood

servers:
  - url: http://localhost:3300
    description: Local development
  - url: https://api.dev.layafood.com
    description: Development server

tags:
  - name: Auth
  - name: Users
  - name: Restaurants
  - name: Categories
  - name: Products
  - name: Ingredients
  - name: Types (Options)
  - name: Extras
  - name: Desserts
  - name: Drinks
  - name: Variations
  - name: Type Variations
  - name: Allergies
  - name: History (Orders)
  - name: Status History
  - name: Settings
  - name: Coupons
  - name: Media Library
  - name: Carousel
  - name: Currency
  - name: Database Export
  - name: Payment
  - name: Utilities
  - name: Static Files

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from POST /api/auth/login

  parameters:
    RestaurantIdHeader:
      name: restaurant-id
      in: header
      required: true
      schema:
        type: string
      description: MongoDB ObjectId of the restaurant
    AppTypeHeader:
      name: app-type
      in: header
      schema:
        type: string
        enum: [mobile, borne, dashboard, cashier, delivery, kitchen]
    LanguageQuery:
      name: lng
      in: query
      schema:
        type: string
        enum: [en, fr, ar]
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number (1-based)
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
        minimum: 1
      description: Items per page
    SearchQuery:
      name: search
      in: query
      schema:
        type: string
      description: Search by name or command number
    StartDateQuery:
      name: startDate
      in: query
      schema:
        type: string
        format: date
        example: "2026-06-01"
      description: Start date (YYYY-MM-DD). Used with filter=custom or stats date range.
    EndDateQuery:
      name: endDate
      in: query
      schema:
        type: string
        format: date
        example: "2026-06-15"
      description: End date (YYYY-MM-DD). Used with filter=custom or stats date range.
    HistoryFilterQuery:
      name: filter
      in: query
      schema:
        type: string
        enum: [all, today, week, month, year, custom]
        default: all
      description: |
        Date filter preset.
        - `all` — no date filter (history list only)
        - `today` — current day
        - `week` — current week
        - `month` — current month
        - `year` — current year (stats only)
        - `custom` — use startDate/endDate
    HistoryStatusQuery:
      name: status
      in: query
      schema:
        type: string
        enum: [enCours, terminee, annulee, echouee, enAttente, enRetard, remboursee]
      description: Filter by order status
    PackIdQuery:
      name: packId
      in: query
      schema:
        type: string
      description: Filter by pack ObjectId (sur place / emporter)
    MethodIdQuery:
      name: methodId
      in: query
      schema:
        type: string
      description: Filter by payment method ObjectId
    MediaTargetTypeQuery:
      name: targetType
      in: query
      schema:
        type: string
        enum: [Product, Category, Ingrediant, Allergy, Settings, Restaurant]
      description: Filter media by target entity type
    MediaTargetIdQuery:
      name: targetId
      in: query
      schema:
        type: string
      description: Filter media by target entity ObjectId
    MediaSearchQuery:
      name: q
      in: query
      schema:
        type: string
      description: Search media by filename
    MediaTypeQuery:
      name: type
      in: query
      schema:
        type: string
        example: category
      description: Media folder type (category, product, ingredient, banner, logo, etc.)
    UserRoleQuery:
      name: role
      in: query
      schema:
        type: string
        enum: [admin, manager, waiter, client]
      description: Filter users by role
    ExportFileQuery:
      name: file
      in: query
      required: true
      schema:
        type: string
        example: restaurant_68d5811fec2a42492440471f_raw_15-06-2026.json
      description: Export filename returned by GET /api/database/export

  responses:
    Unauthorized:
      description: Missing or invalid token
    Forbidden:
      description: Insufficient role permissions
    NotFound:
      description: Resource not found

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    MediaUpload:
      type: object
      properties:
        image:
          type: string
          format: binary
        mediaId:
          type: string
          description: Existing media library item ID

security:
  - bearerAuth: []

paths:
  /welcome:
    get:
      tags: [Utilities]
      summary: Welcome / health check with i18n
      security: []
      parameters:
        - $ref: '#/components/parameters/LanguageQuery'
      responses:
        '200':
          description: Welcome message

  /adminRoute:
    get:
      tags: [Utilities]
      summary: Admin-only test route
      responses:
        '200':
          description: Authenticated admin message
        '403':
          $ref: '#/components/responses/Forbidden'

  /managerRoute:
    get:
      tags: [Utilities]
      summary: Manager-only test route
      responses:
        '200':
          description: Authenticated manager message

  /waiterRoute:
    get:
      tags: [Utilities]
      summary: Waiter-only test route
      responses:
        '200':
          description: Authenticated waiter message

  /clientRoute:
    get:
      tags: [Utilities]
      summary: Client-only test route
      responses:
        '200':
          description: Authenticated client message

  # ─── AUTH / USERS ───────────────────────────────────────────
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and receive JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT token and user info
        '401':
          description: Invalid credentials

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate session)
      responses:
        '200':
          description: Logged out

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      security: []
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
        - $ref: '#/components/parameters/AppTypeHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
                name: { type: string }
                role: { type: string, enum: [admin, manager, waiter, client] }
      responses:
        '201':
          description: User created

  /api/auth/create:
    post:
      tags: [Users]
      summary: Create user (admin)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: User created

  /api/auth/:
    get:
      tags: [Users]
      summary: Get all users (global admin)
      responses:
        '200':
          description: List of users

  /api/auth/users:
    get:
      tags: [Users]
      summary: Get users for restaurant
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Restaurant users

  /api/auth/users/assignable:
    get:
      tags: [Users]
      summary: Get assignable users for restaurant
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/UserRoleQuery'
      responses:
        '200':
          description: Assignable users

  /api/auth/user:
    get:
      tags: [Users]
      summary: Get current authenticated user
      responses:
        '200':
          description: User profile

  /api/auth/{userId}/restaurants:
    get:
      tags: [Users]
      summary: Get restaurants assigned to user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User restaurants

  /api/auth/{userId}:
    put:
      tags: [Users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: User deleted

  /api/auth/block/{userId}:
    put:
      tags: [Users]
      summary: Block/unblock user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: User block status updated

  /api/auth/{userId}/assign:
    post:
      tags: [Users]
      summary: Assign user to restaurant
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: User assigned

  /api/auth/{userId}/unassign:
    delete:
      tags: [Users]
      summary: Unassign user from restaurant
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: User unassigned

  /api/auth/{userId}/notif:
    put:
      tags: [Users]
      summary: Update user restaurant notification settings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notifications updated

  # ─── RESTAURANTS ────────────────────────────────────────────
  /api/restaurant/:
    get:
      tags: [Restaurants]
      summary: Get mobile restaurants for user
      responses:
        '200':
          description: Restaurant list
    post:
      tags: [Restaurants]
      summary: Create restaurant (admin only)
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Restaurant created

  /api/restaurant/all:
    get:
      tags: [Restaurants]
      summary: Get all restaurants (dashboard)
      responses:
        '200':
          description: All restaurants

  /api/restaurant/{restaurantId}:
    get:
      tags: [Restaurants]
      summary: Get restaurant by ID
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Restaurant details
    put:
      tags: [Restaurants]
      summary: Update restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                logo: { type: string, format: binary }
      responses:
        '200':
          description: Restaurant updated
    delete:
      tags: [Restaurants]
      summary: Delete restaurant (admin only)
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Restaurant deleted

  /api/restaurant/{restaurantId}/users:
    post:
      tags: [Restaurants]
      summary: Assign user to restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User assigned
    delete:
      tags: [Restaurants]
      summary: Remove user from restaurant
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User removed

  # ─── CATEGORIES ───────────────────────────────────────────────
  /api/category/:
    get:
      tags: [Categories]
      summary: Get categories with products (kiosk/menu)
      description: Returns full menu tree with products, options, ingredients populated
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Categories with nested products
    post:
      tags: [Categories]
      summary: Create category
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                image: { type: string, format: binary }
                mediaId: { type: string }
      responses:
        '201':
          description: Category created

  /api/category/all:
    get:
      tags: [Categories]
      summary: Get all categories (dashboard list)
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Category list with resolved image URLs

  /api/category/position:
    put:
      tags: [Categories]
      summary: Update category positions (reorder)
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                positions:
                  type: array
                  items:
                    type: object
                    properties:
                      _id: { type: string }
                      position: { type: number }
      responses:
        '200':
          description: Positions updated

  /api/category/update/{categoryId}:
    put:
      tags: [Categories]
      summary: Update category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                image: { type: string, format: binary }
                mediaId: { type: string }
      responses:
        '200':
          description: Category updated

  /api/category/position/{categoryId}:
    put:
      tags: [Categories]
      summary: Update product positions within category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                positions:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Product positions updated

  /api/category/{categoryId}:
    delete:
      tags: [Categories]
      summary: Delete category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Category deleted

  # ─── PRODUCTS ─────────────────────────────────────────────────
  /api/product/:
    get:
      tags: [Products]
      summary: Get all products (dashboard)
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: All products with categories
    post:
      tags: [Products]
      summary: Add product to category
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                price: { type: number }
                categories: { type: string, description: JSON array of category IDs }
                image: { type: string, format: binary }
                mediaId: { type: string }
                type: { type: string, description: JSON array of option type IDs }
                choice: { type: string, enum: [seul, multiple] }
      responses:
        '201':
          description: Product created

  /api/product/seul:
    get:
      tags: [Products]
      summary: Get standalone products (choice=seul)
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Standalone products

  /api/product/category/migrate:
    post:
      tags: [Products]
      summary: Migrate products to a category
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Migration result

  /api/product/{categoryId}:
    get:
      tags: [Products]
      summary: Get products by category
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Products in category

  /api/product/{productId}/{variationId}:
    get:
      tags: [Products]
      summary: Get product detail with variation
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: variationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Product detail

  /api/product/update/{productId}:
    put:
      tags: [Products]
      summary: Update product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        '200':
          description: Product updated

  /api/product/{productId}:
    delete:
      tags: [Products]
      summary: Delete product
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Product deleted

  /api/product/discount/{productId}:
    put:
      tags: [Products]
      summary: Set product discount
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                discountValue: { type: number }
                discountStartDate: { type: string, format: date-time }
                discountEndDate: { type: string, format: date-time }
      responses:
        '200':
          description: Discount applied
    delete:
      tags: [Products]
      summary: Remove product discount
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Discount removed

  # ─── INGREDIENTS ──────────────────────────────────────────────
  /api/ingrediant/:
    get:
      tags: [Ingredients]
      summary: Get all ingredients
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Ingredient list
    post:
      tags: [Ingredients]
      summary: Create ingredient
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name: { type: string }
                price: { type: number }
                suppPrice: { type: number }
                image: { type: string, format: binary }
                mediaId: { type: string }
      responses:
        '201':
          description: Ingredient created

  /api/ingrediant/update/{ingrediantId}:
    put:
      tags: [Ingredients]
      summary: Update ingredient
      parameters:
        - name: ingrediantId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        '200':
          description: Ingredient updated

  /api/ingrediant/{ingrediantId}:
    delete:
      tags: [Ingredients]
      summary: Delete ingredient
      parameters:
        - name: ingrediantId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Ingredient deleted

  # ─── TYPES (OPTIONS) ──────────────────────────────────────────
  /api/type/:
    get:
      tags: [Types (Options)]
      summary: Get all option types
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Option types with ingredients/products
    post:
      tags: [Types (Options)]
      summary: Create option type
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                label: { type: string }
                message: { type: string }
                min: { type: number }
                max: { type: number }
                payment: { type: boolean }
                selection: { type: boolean }
                mode: { type: string, enum: [INGREDIENTS, PRODUCTS] }
                ingredients: { type: array, items: { type: object } }
                products: { type: array, items: { type: object } }
      responses:
        '201':
          description: Option type created

  /api/type/{typeId}:
    get:
      tags: [Types (Options)]
      summary: Get option type by ID
      parameters:
        - name: typeId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Option type detail
    delete:
      tags: [Types (Options)]
      summary: Delete option type
      parameters:
        - name: typeId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/RestaurantIdHeader'
      responses:
        '200':
          description: Option type deleted

  /api/type/update/{typeId}:
    put:
      tags: [Types (Options)]
