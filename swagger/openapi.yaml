  # ─── HISTORY (ORDERS) ─────────────────────────────────────────
  /api/history/:
    get:
      tags: [History (Orders)]
      summary: Get order history (paginated)
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
        - $ref: '#/components/parameters/AppTypeHeader'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/HistoryFilterQuery'
        - $ref: '#/components/parameters/HistoryStatusQuery'
        - $ref: '#/components/parameters/PackIdQuery'
        - $ref: '#/components/parameters/MethodIdQuery'
        - $ref: '#/components/parameters/StartDateQuery'
        - $ref: '#/components/parameters/EndDateQuery'
      responses:
        '200':
          description: Order history list with pagination
    post:
      tags: [History (Orders)]
      summary: Create new order
      description: Triggers Socket.IO `new-history` and `status-update` events
      parameters:
        - $ref: '#/components/parameters/RestaurantIdHeader'
        - $ref: '#/components/parameters/AppTypeHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Order created

  /api/history/stats:
    get:
      tags: [History (Orders)]
      summary: Get order statistics (revenue, counts, charts)
      description: |
        Returns dashboard statistics for the selected period.
        Defaults to `filter=today` when no params are provided.

        **Example:** `/api/history/stats?filter=today`
      parameters:
        - name: restaurant-id
          in: header
          required: true
          schema:
            type: string
          description: MongoDB ObjectId of the restaurant
        - name: app-type
          in: header
          schema:
            type: string
            enum: [mobile, borne, dashboard, cashier, delivery, kitchen]
            example: dashboard
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [today, week, month, year, custom]
            default: today
          description: Date range preset
        - name: startDate
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-06-01"
          description: Start date — use with filter=custom
        - name: endDate
          in: query
          required: false
          schema:
            type: string
            format: date
            example: "2026-06-15"
          description: End date — use with filter=custom
      responses:
        '200':
          description: Statistics (revenue, order counts, payment/pack breakdown)

